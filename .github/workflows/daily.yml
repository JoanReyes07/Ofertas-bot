name: ofertas-diarias

on:
  schedule:
    - cron: "0 14 * * *"   # 8:00 CDMX: busca candidatos nuevos
    - cron: "0 16 * * *"   # 10:00 CDMX: publica una tanda (5)
    - cron: "0 20 * * *"   # 14:00 CDMX
    - cron: "0 0 * * *"    # 18:00 CDMX
    - cron: "0 3 * * *"    # 21:00 CDMX
  workflow_dispatch:
    inputs:
      accion:
        description: "fetch o publish"
        default: "publish"

permissions:
  contents: write

# Nunca dos ejecuciones a la vez (p. ej. la app lanza publish mientras corre el de las 12:00)
concurrency:
  group: ofertas
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      MELI_CLIENT_ID: ${{ secrets.MELI_CLIENT_ID }}
      MELI_CLIENT_SECRET: ${{ secrets.MELI_CLIENT_SECRET }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      WEB_URL: ${{ vars.WEB_URL }}
      SITE_NAME: ${{ vars.SITE_NAME }}
      CATEGORIES: ${{ vars.CATEGORIES }}
      AUTO_LINKS: ${{ vars.AUTO_LINKS }}
      MELI_MATT_WORD: ${{ vars.MELI_MATT_WORD }}
      MELI_MATT_TOOL: ${{ vars.MELI_MATT_TOOL }}
      MELI_TAGS: ${{ vars.MELI_TAGS }}
      # link de la web que ve el público (sin .github.io)
      SHORT_URL: ${{ vars.SHORT_URL || 'https://tinyurl.com/cazaofertasmx' }}
      # Facebook: Reels por tanda (4 tandas al día), historias al día, Top 5 en el muro
      FB_PER_RUN: ${{ vars.FB_PER_RUN }}
      FB_STORIES: ${{ vars.FB_STORIES }}
      FB_TOP5: ${{ vars.FB_TOP5 }}
      FB_REEL_COMMENT: ${{ vars.FB_REEL_COMMENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Elegir acción
        id: a
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "cmd=${{ github.event.inputs.accion }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 14 * * *" ]; then
            echo "cmd=fetch" >> $GITHUB_OUTPUT
          else
            echo "cmd=publish" >> $GITHUB_OUTPUT
          fi
      - run: python -m bot ${{ steps.a.outputs.cmd }}
      - name: Guardar cambios
        run: |
          git config user.name "ofertas-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A .
          git diff --cached --quiet && exit 0
          git commit -m "ofertas: ${{ steps.a.outputs.cmd }}"
          # si mientras corría se subieron enlaces desde la app, integrarlos antes de subir
          git pull --rebase -X theirs origin main || { git rebase --abort; git pull --no-rebase -X ours origin main; }
          git push
