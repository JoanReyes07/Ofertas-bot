plugins {
    id "com.android.application"
}

android {
    namespace "mx.ofertas.app"
    compileSdk 35

    defaultConfig {
        applicationId "mx.ofertas.app"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Firmado con la llave de depuración para poder instalarlo directo (uso personal)
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
